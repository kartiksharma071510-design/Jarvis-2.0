name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
